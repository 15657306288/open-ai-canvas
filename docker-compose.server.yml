services:
  postgres:
    container_name: open-ai-canvas-postgres
    # 部分云主机内核在默认 seccomp 配置下会拦下 postgres 需要的系统调用，
    # 表现为 “could not write to file postmaster.pid: Operation not permitted” 无法启动。
    # 这台服务器必需保留；重新创建 postgres 容器时不要删掉这一项。
    security_opt:
      - seccomp:unconfined
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-open_ai_canvas}
      POSTGRES_USER: ${POSTGRES_USER:-open_ai_canvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须配置 PostgreSQL 密码}
    volumes:
      - ${CANVAS_POSTGRES_DATA_PATH:-./postgres-data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    container_name: open-ai-canvas-redis
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - ${CANVAS_REDIS_DATA_PATH:-./redis-data}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    container_name: open-ai-canvas-migrate
    image: open-ai-canvas-backend:server
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    command: ["migrate-schema", "up"]
    environment:
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_DATABASE_DRIVER: postgres
      DATABASE_URL: ${DATABASE_URL:?必须配置 PostgreSQL 数据库连接}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    container_name: open-ai-canvas-backend
    image: open-ai-canvas-backend:server
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    environment:
      CANVAS_BACKEND_ADDR: ":8080"
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_AUTO_MIGRATE: "false"
      CANVAS_SHUTDOWN_TIMEOUT: ${CANVAS_SHUTDOWN_TIMEOUT:-10m}
      CANVAS_DATABASE_DRIVER: postgres
      DATABASE_URL: ${DATABASE_URL:?必须配置 PostgreSQL 数据库连接}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CANVAS_WORKER_CONCURRENCY: ${CANVAS_WORKER_CONCURRENCY:-3}
      CANVAS_CHANNEL_CONCURRENCY: ${CANVAS_CHANNEL_CONCURRENCY:-3}
      CANVAS_REGISTRATION_ENABLED: ${CANVAS_REGISTRATION_ENABLED:-false}
      CANVAS_ALLOW_PRIVATE_UPSTREAMS: ${CANVAS_ALLOW_PRIVATE_UPSTREAMS:-false}
      CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS: ${CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS:-}
      CANVAS_CORS_ORIGINS: ${CANVAS_CORS_ORIGINS:-*}
      GIN_MODE: release
    volumes:
      - ${CANVAS_DATA_PATH:-./data}:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: ${CANVAS_SHUTDOWN_TIMEOUT:-10m}

  web:
    container_name: open-ai-canvas-web
    image: open-ai-canvas-web:server
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # 3000 是 Cloudflare 隧道（cloudflared-config.yml）的入口，删掉会导致外网 502。
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:5173:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
