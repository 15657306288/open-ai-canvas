<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="AI 影视与短剧创作工作台" />
        <!-- 不写内置品牌资源：首屏必须品牌中性，favicon 由 use-appearance-store 解析出外观后写入。
             空 data URL 只是为了不让浏览器去请求 /favicon.ico（那会是一条 404）。 -->
        <link rel="icon" href="data:," />
        <title>正在加载</title>
        <style>
            /* Fix layer order before production chunks can register utilities ahead of base. */
            @layer theme, base, components, utilities;

            html,
            body {
                margin: 0;
                background: #ffffff;
            }
            /* 与 globals.css 的 .dark --background 一致；暗色主题下切页或首屏不透出白底。 */
            html.dark,
            html.dark body {
                background: #0f0f11;
            }
            #boot-recovery {
                position: fixed;
                inset: 0;
                display: grid;
                align-content: center;
                justify-items: center;
                gap: 16px;
                padding: 24px;
                background: inherit;
                color: #171717;
                font: 16px/1.6 sans-serif;
                text-align: center;
            }
            #boot-recovery button {
                padding: 10px 24px;
                border: 1px solid currentColor;
                border-radius: 8px;
                background: transparent;
                color: inherit;
                font: inherit;
                cursor: pointer;
            }
            html.dark #boot-recovery {
                color: #f5f5f5;
            }
            #root:empty {
                min-height: 100vh;
            }
            /* 启动信号是 FullScreenLoader 里 .loading-signal 的镜像：同尺寸、同位置、同节奏，
               并按同一 performance.now() 时钟对齐相位（见 body 内脚本），React 接管时扫光原地继续。
               只用中性墨色，首屏保持品牌中性；改动时与 globals.css 的 .loading-signal 一起改。 */
            #root:empty::before {
                --boot-signal-ink: rgba(23, 23, 23, 0.8);
                content: "";
                position: fixed;
                left: 50%;
                top: 50%;
                width: 112px;
                height: 2px;
                margin: -1px 0 0 -56px;
                border-radius: 999px;
                background:
                    linear-gradient(90deg, transparent, var(--boot-signal-ink) 25%, var(--boot-signal-ink) 75%, transparent) -66.667% 0 / 40% 100% no-repeat,
                    rgba(16, 16, 20, 0.1);
                animation: boot-signal-sweep 1500ms cubic-bezier(0.35, 0.05, 0.65, 0.95) calc(-1 * var(--boot-signal-clock, 0ms)) infinite;
            }
            html.dark #root:empty::before {
                --boot-signal-ink: rgba(245, 245, 245, 0.8);
                background-color: rgba(244, 244, 246, 0.1);
            }
            @keyframes boot-signal-sweep {
                from {
                    background-position: -66.667% 0;
                }
                to {
                    background-position: 166.667% 0;
                }
            }
            @keyframes boot-signal-breathe {
                0%,
                100% {
                    opacity: 0.35;
                }
                50% {
                    opacity: 1;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #root:empty::before {
                    background-position: 50% 0;
                    animation-name: boot-signal-breathe;
                    animation-timing-function: ease-in-out;
                }
            }
        </style>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("yingce:theme_store") || "{}");
                var t = s.state && s.state.theme === "dark" ? "dark" : "light";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
        <script id="boot-watchdog">
            (() => {
                // 在生产入口及样式开始加载前监听。自动刷新由 chunk-recovery.ts 统一负责。
                let recovered = new URL(location.href).searchParams.has("__chunk_recovery");
                try { recovered ||= sessionStorage.getItem("canvas:chunk-recovery") === "1"; } catch {}
                let phase = "loading";
                let failureTimer;
                const slowTimer = setTimeout(() => transition("slow"), 45000);
                const observer = new MutationObserver(sync);
                observer.observe(document.documentElement, { subtree: true, childList: true });
                window.addEventListener("vite:preloadError", resourceFailed);
                window.addEventListener("error", captureResource, true);

                function captureResource(event) {
                    const target = event.target;
                    if (target?.tagName === "SCRIPT" || (target?.tagName === "LINK" && /^(stylesheet|modulepreload)$/.test(target.rel))) resourceFailed();
                }
                function resourceFailed() {
                    if (phase === "mounted" || phase === "failed" || failureTimer !== undefined) return;
                    clearTimeout(slowTimer);
                    if (recovered) transition("failed");
                    else failureTimer = setTimeout(() => transition("failed"), 1800);
                }
                function transition(next) {
                    phase = next;
                    sync();
                }
                function sync() {
                    const root = document.getElementById("root");
                    if (!root) return;
                    const notice = document.getElementById("boot-recovery");
                    if (root.childNodes.length) {
                        phase = "mounted";
                        clearTimeout(slowTimer);
                        clearTimeout(failureTimer);
                        observer.disconnect();
                        window.removeEventListener("vite:preloadError", resourceFailed);
                        window.removeEventListener("error", captureResource, true);
                        notice?.remove();
                        return;
                    }
                    if (phase === "loading" || notice?.dataset.phase === phase) return;
                    const panel = document.createElement("section");
                    panel.id = "boot-recovery";
                    panel.dataset.phase = phase;
                    const failed = phase === "failed";
                    panel.setAttribute("role", failed ? "alert" : "status");
                    const title = document.createElement("strong");
                    title.textContent = failed ? "部分资源加载失败" : "连接速度较慢";
                    const detail = document.createElement("p");
                    detail.textContent = (failed ? (recovered ? "重试后仍无法加载启动资源，请检查网络。" : "启动资源未能加载，请检查网络。") : "页面仍在加载，可以继续等待。") + "重新加载不会清除画布缓存。";
                    const retry = document.createElement("button");
                    retry.type = "button";
                    retry.textContent = "重新加载";
                    retry.onclick = () => {
                        const url = new URL(location.href);
                        url.searchParams.set("__chunk_recovery", String(Date.now()));
                        location.replace(url.toString());
                    };
                    panel.append(title, detail, retry);
                    if (notice) notice.replaceWith(panel);
                    else document.body.appendChild(panel);
                }
            })();
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script>
            document.getElementById("root").style.setProperty("--boot-signal-clock", performance.now() + "ms");
        </script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
